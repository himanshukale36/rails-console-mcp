name: CI and npm publish

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          CI: true

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      # Add ESLint/Prettier here when configured
      # - run: npx eslint src/
      # - run: npx prettier --check src/

  publish:
    needs: [build-and-test, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: npm-publish-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - run: npm ci
      - run: npm test
      - name: Bump patch version and publish
        id: release
        run: |
          current_version="$(npm view rails-console-mcp version)"
          next_version="$(node -e 'const [major, minor, patch] = process.argv[1].split(".").map(Number); console.log(`${major}.${minor}.${patch + 1}`)' "$current_version")"
          npm version "$next_version" --no-git-tag-version
          npm publish --access public
          echo "version=$next_version" >> "$GITHUB_OUTPUT"
      - name: Commit published version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "chore: bump npm version to ${{ steps.release.outputs.version }}"
          git push origin HEAD:main
